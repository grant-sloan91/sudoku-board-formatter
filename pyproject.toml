[project]
name = "sudoku-board-formatter"
version = "0.1.0"
description = "Normalize messy sudoku puzzle text into a canonical grid"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "grant-sloan91" }]

[project.scripts]
sudoku-fmt = "sudoku_fmt.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sudoku_fmt*"]
